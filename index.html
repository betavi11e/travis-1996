<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travis — Netscape Navigator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#win{
  flex-shrink:0;
  width:942px;
  background:#d3d4d7;
  border:1px solid #000;
  border-radius:6px 6px 3px 3px;
  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #9a9c9f,0 12px 38px rgba(0,0,0,0.6);
  overflow:hidden;
  font-family:'Charcoal','Geneva','Lucida Grande',Tahoma,sans-serif;
  transform-origin:center center;
}
#titlebar{
  height:22px;display:flex;align-items:center;gap:8px;padding:0 8px;
  background:repeating-linear-gradient(to bottom,#e6e6e6 0 1px,#a9adb2 1px 2px);
  border-bottom:1px solid #87898d;cursor:default;user-select:none;position:relative;
}
.sbox{width:12px;height:12px;border-radius:2px;flex-shrink:0;
  background:linear-gradient(#fbfbfb,#d3d4d7);
  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #87898d;border:1px solid #5b5d61}
#title-plate{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:#d3d4d7;padding:0 10px;
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;color:#1d1d1f;white-space:nowrap;
}
.globe-sm{width:13px;height:13px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 35% 30%,#6fb1ff,#14387a 70%);
  box-shadow:inset 0 0 0 1px #0b2350}
.globe-lg{width:26px;height:26px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 35% 30%,#8fd0ff,#1657b0 70%);
  border:1px solid #0b2350;box-shadow:inset 0 1px 1px rgba(255,255,255,0.6)}
#toolbar{
  height:38px;display:flex;align-items:center;gap:6px;padding:0 8px;
  background:linear-gradient(#ededed,#d7d8db);border-bottom:1px solid #b6b8bc;
}
.btn{
  background:linear-gradient(#fbfbfb,#d3d4d7);
  box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #87898d;
  border:1px solid #5b5d61;border-radius:5px;height:26px;
  min-width:44px;padding:0 9px;
  display:inline-flex;align-items:center;gap:5px;
  font-family:inherit;font-size:11px;font-weight:700;color:#1d1d1f;cursor:pointer;
}
#locbar{
  height:26px;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:#d3d4d7;border-bottom:1px solid #b6b8bc;
}
#locbar label{font-size:11px;font-weight:700;color:#4a4c50;flex-shrink:0}
#loctext{
  flex:1;height:16px;line-height:16px;background:#fff;
  box-shadow:inset 1px 1px 0 #9a9c9f,inset -1px -1px 0 #fff;
  border:1px solid #87898d;padding:0 6px;font-size:11px;color:#1d1d1f;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit;
}
#content{display:block;width:940px;height:740px;border:none;background:#fff}
#statusbar{
  height:22px;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:linear-gradient(#ededed,#d3d4d7);border-top:1px solid #b6b8bc;
  font-size:11px;color:#3a3c40;
}
</style>
</head>
<body>
<div id="stage">
  <div id="win">

    <div id="titlebar">
      <div class="sbox" style="cursor:pointer" title="Close" onclick="window.close()"></div>
      <div style="flex:1"></div>
      <div id="title-plate">
        <div class="globe-sm"></div>
        Travis — Netscape Navigator
      </div>
      <div style="display:flex;gap:6px">
        <div class="sbox"></div>
        <div class="sbox"></div>
      </div>
    </div>

    <div id="toolbar">
      <button class="btn" onclick="nav('back')">&#9664; Back</button>
      <button class="btn" onclick="nav('forward')">&#9654; Forward</button>
      <button class="btn" onclick="nav('reload')">Reload</button>
      <button class="btn" onclick="nav('home')">Home</button>
      <div style="flex:1"></div>
      <div class="globe-lg"></div>
    </div>

    <div id="locbar">
      <label>Location:</label>
      <div id="loctext">file:///Travis/home.html</div>
    </div>

    <iframe id="content" src="home.html" title="Travis" loading="eager"
      onload="updateLoc(this)"></iframe>

    <div id="statusbar">
      <span>&#128274;</span>
      <span>Document: Done.</span>
      <div style="flex:1"></div>
      <span style="letter-spacing:0.3px;color:#6a6c70">Netscape</span>
    </div>

  </div>
</div>
<script>
var frame = document.getElementById('content');
var locEl  = document.getElementById('loctext');
var WIN_W  = 942, WIN_H = 850; // 22+38+26+740+22+2

function updateLoc(f) {
  try {
    var href = f.contentWindow.location.href;
    var path = href.replace(/^https?:\/\/[^\/]+\//, '');
    locEl.textContent = 'file:///Travis/' + (path || 'home.html');
  } catch(e) {}
}

function nav(cmd) {
  if (cmd === 'home') { frame.src = 'home.html'; return; }
  frame.contentWindow.postMessage(cmd, '*');
}

function rescale() {
  var sw = window.innerWidth  - 32;
  var sh = window.innerHeight - 32;
  var s  = Math.min(1, sw / WIN_W, sh / WIN_H);
  document.getElementById('win').style.transform = 'scale(' + s + ')';
}
rescale();
window.addEventListener('resize', rescale);
</script>
</body>
</html>
